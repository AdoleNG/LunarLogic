<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created - Lunar Logic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            font-family: 'Quicksand', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 450px;
            background: #0284c7;
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 26px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            box-sizing: border-box;
            border: 4px solid #bae6fd;
            text-align: center;
        }

        h2 {
            font-family: 'Fredoka', sans-serif;
            color: #0284c7;
            font-size: 26px;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        p {
            color: #475569;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            border: none;
            background: #10b981;
            color: white;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="header">🚀 Lunar Logic</div>

<div class="container">
    <div style="font-size: 45px; margin-bottom: 10px;">🎉</div>
    <h2>Account Created!</h2>
    <p>Welcome aboard, explorer! Your stellar space has been successfully set up and you're all set to begin your journey.</p>
    
    <a href="/" class="btn">Return to Home ✨</a>
</div>

</body>
</html>
