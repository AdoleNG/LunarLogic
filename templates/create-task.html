<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task - Lunar Logic</title>
    <!-- Import identical playful Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            font-family: 'Quicksand', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            box-sizing: border-box;
            border: 4px solid #bae6fd;
            text-align: center;
        }

        .header {
            background: #0284c7; /* Bright friendly sky blue */
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 24px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        label {
            font-family: 'Fredoka', sans-serif;
            font-weight: 400;
            font-size: 15px;
            display: block;
            margin-top: 18px;
            text-align: left;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #0284c7;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block;
            box-sizing: border-box;
        }

        .btn-primary {
            background: #10b981; /* Cheerful Mint Green */
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-back {
            background: #e2e8f0;
            color: #64748b;
        }

        .btn-back:hover {
            background: #cbd5e1;
            color: #475569;
        }

        /* Mobile responsiveness adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
                border-radius: 16px;
                border-width: 2px;
            }

            .header {
                font-size: 20px;
                padding: 14px;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">✨ Create a Task</div>

    <form action="/create-task?username={{ parent_username }}" method="POST">

        <label for="task_name">Task Name:</label>
        <input type="text" id="task_name" name="task_name" placeholder="Enter a fun space mission name" required>

        <div class="btn-container">
            <a href="/parent-dashboard?username={{ parent_username }}" class="btn btn-back">Back</a>
            <button class="btn btn-primary" type="submit">Add Task</button>
        </div>
    </form>
</div>

</body>
</html>
