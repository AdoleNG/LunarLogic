<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Assigned - Lunar Logic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            font-family: 'Quicksand', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 450px;
            background: #0284c7; /* Bright friendly sky blue */
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 26px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            box-sizing: border-box;
            border: 4px solid #bae6fd;
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Fredoka', sans-serif;
            color: #059669; /* Cheerful success green */
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .success-box {
            background-color: #f0fdf4;
            padding: 18px;
            border-radius: 16px;
            border: 2px solid #bbf7d0;
            margin-bottom: 25px;
            font-size: 17px;
            color: #166534;
        }

        .success-box strong {
            font-family: 'Fredoka', sans-serif;
            display: block;
            margin-bottom: 5px;
            color: #15803d;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            background: #10b981; /* Cheerful Mint Green */
            color: white;
            display: inline-block;
            box-sizing: border-box;
        }

        .btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.3);
        }

        /* Mobile responsiveness adjustments */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
                border-radius: 16px;
                border-width: 2px;
            }

            .header {
                font-size: 22px;
                padding: 14px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

<div class="header">🚀 Lunar Logic</div>

<div class="container">
    <h2>Mission Launched! 🎉</h2>

    <div class="success-box">
        <strong>Assigned Mission:</strong>
        <span>✨ {{ task_name }}</span>
    </div>

    <a href="/parent-dashboard?username={{ parent_username }}" class="btn">
        Return to Dashboard
    </a>
</div>

</body>
</html>
