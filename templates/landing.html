<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Logic - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            font-family: 'Quicksand', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 480px;
            background: #0284c7;
            color: white;
            padding: 22px;
            border-radius: 20px;
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 32px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            box-sizing: border-box;
        }

        .subheader {
            text-align: center;
            font-size: 16px;
            margin-bottom: 25px;
            color: #334155;
            font-family: 'Fredoka', sans-serif;
            font-weight: 400;
            max-width: 420px;
            padding: 0 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            box-sizing: border-box;
            border: 4px solid #bae6fd;
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-image-container {
            margin-bottom: 20px;
        }

        .hero-image-container img {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            border: 3px solid #e0f2fe;
        }

        .container p {
            font-size: 16px;
            color: #475569;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .button-row {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: inline-block;
        }

        .btn-create {
            background-color: #10b981;
            color: #ffffff;
        }

        .btn-create:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-parent {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-parent:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(2, 132, 199, 0.3);
        }

        .btn-child {
            background-color: #f59e0b;
            color: #ffffff;
        }

        .btn-child:hover {
            background-color: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(245, 158, 11, 0.3);
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px;
                border-radius: 16px;
                border-width: 2px;
            }
            .header {
                font-size: 26px;
                padding: 16px;
                margin-top: 10px;
            }
            .subheader {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header">🚀 Lunar Logic</div>
    <div class="subheader">Your stellar portal for family missions and task tracking!</div>

    <div class="container">
        <!-- Hero Illustration -->
        <div class="hero-image-container">
            <img src="{{ url_for('static', filename='chores-hero.png') }}" alt="Kids performing household chores">
        </div>

        <p>Choose an option below to get started:</p>
        
        <div class="button-row">
            <a href="/create-account" class="btn btn-create">✨ Create New Account</a>
            <a href="/parent-login" class="btn btn-parent">👑 Parent Login</a>
            <a href="/child-login" class="btn btn-child">⭐ Kid Explorer Login</a>
        </div>
    </div>

</body>
</html>
