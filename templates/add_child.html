<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Child Explorer - Lunar Logic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            font-family: 'Quicksand', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 480px;
            background: #0284c7;
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 26px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            box-sizing: border-box;
            border: 4px solid #bae6fd;
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Fredoka', sans-serif;
            color: #0284c7;
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #475569;
            font-size: 15px;
            margin-bottom: 20px;
        }

        label {
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            display: block;
            margin-top: 15px;
            text-align: left;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #0284c7;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-back {
            background: #e2e8f0;
            color: #64748b;
        }

        .btn-back:hover {
            background: #cbd5e1;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="header">🚀 Lunar Logic</div>

<div class="container">
    <h2>Add New Explorer</h2>
    <p>Create a space account for your child linked to your profile.</p>

    <form action="/parent/add-child" method="POST">
        <input type="hidden" name="parent_username" value="{{ parent_username }}">

        <label for="name">Child's Full Name:</label>
        <input type="text" id="name" name="name" placeholder="e.g., Keera" required>

        <label for="username">Child's Username:</label>
        <input type="text" id="username" name="username" placeholder="Choose a unique username" required>

        <label for="password">Child's Password:</label>
        <input type="password" id="password" name="password" placeholder="Create a password for them" required>

        <div class="btn-container">
            <a href="/parent-kids?username={{ parent_username }}" class="btn btn-back">Back</a>
            <button type="submit" class="btn btn-primary">Save Child ✨</button>
        </div>
    </form>
</div>

</body>
</html>
